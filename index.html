    <style>
      body,
      button,
      html,
      input,
      select,
      textarea {
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Oxygen,
          Ubuntu,
          Cantarell,
          'Open Sans',
          'Helvetica Neue';
      }

      /* Loading screen styles */
      .loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        background: #ffffff;
        position: fixed;
        left: 0;
        top: 0;
        z-index: 99999;
      }

      /* Subtle warm gradient glow */
      .loading-screen::before {
        content: '';
        position: absolute;
        top: -120px;
        right: -80px;
        width: 400px;
        height: 400px;
        background: radial-gradient(circle, rgba(249, 115, 22, 0.08) 0%, rgba(245, 158, 11, 0.03) 50%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
        filter: blur(60px);
      }

      .loading-screen::after {
        content: '';
        position: absolute;
        bottom: -80px;
        left: -60px;
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, rgba(158, 0, 255, 0.05) 0%, rgba(202, 46, 46, 0.02) 50%, transparent 70%);
        border-radius: 50%;
        pointer-events: none;
        filter: blur(60px);
      }

      /* Marketing bracket logo */
      .loading-logo-wrapper {
        width: 240px;
        max-width: 70vw;
        opacity: 0;
        animation: fadeInLogo 0.8s ease-out 0.1s forwards;
      }

      .loading-logo-wrapper svg {
        width: 100%;
        height: auto;
      }

      /* Progress bar container */
      .loading-progress {
        margin-top: 28px;
        width: 180px;
        height: 3px;
        background: #f3f4f6;
        border-radius: 3px;
        overflow: hidden;
        opacity: 0;
        animation: fadeInLogo 0.4s ease-out 0.5s forwards;
      }

      .loading-progress-bar {
        height: 100%;
        width: 30%;
        background: linear-gradient(90deg, #f97316, #f59e0b);
        border-radius: 3px;
        animation: progressSlide 1.5s ease-in-out infinite;
      }

      @keyframes fadeInLogo {
        to {
          opacity: 1;
        }
      }

      @keyframes progressSlide {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(250%);
        }
        100% {
          transform: translateX(450%);
        }
      }
    </style>
